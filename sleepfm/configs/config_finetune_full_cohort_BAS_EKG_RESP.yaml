# Leg 1 (published SleepFM checkpoint + leakage, full-cohort scale).
# Full-cohort fine-tuning config for the published SleepFM encoder
# (sleepfm/checkpoints/model_base, modality_types=['BAS','RESP','EKG','EMG']),
# BAS+EKG+RESP modality -- matches PUB_SleepFM_results.txt's third row exactly.
model_params:
  embed_dim: 128
  num_heads: 4
  num_layers: 2
  num_classes: 5
  pooling_head: 4
  dropout: 0.3
  max_seq_length: 1500

max_channels: 4
context: -1
seed: 42
model: "SleepEventLSTMClassifier"
dataset: "mesa"
batch_size: 16
epochs: 500
lr: 0.0001
num_workers: 2
early_stopping_patience: 50

data_path: "/scratch/project_2019517/sleepfm-data/mesa/hdf5_full"
model_path: "/users/hamehdi/projects/sleepfm-mesa/sleepfm/checkpoints/model_base"
split_path: "sleepfm/configs/dataset_split_fold5_v1.json"
labels_path: "/scratch/project_2019517/sleepfm-data/mesa/labels"
save_iter: 1000
eval_iter: 1000
log_interval: 10
accumulation_steps: 16
use_wandb: false

max_files: null
sampling_freq: 128

channel_like: ["BAS", "EKG", "RESP"]
