# Moody/PhysioNet 2026 (I0006) fine-tuning config -- EEG3-only,
# Next-Token. Copied from
# config_ft_fromscratch_eegonly_fullcohort_EEG3_ONLY_moody.yaml with ONLY
# model_path changed to point at the Next-Token-retrained Moody encoder's
# EEG3_ONLY copy (same architecture fact used throughout this project:
# SetTransformer's per-channel weights are shared/reusable across any
# channel subset -- best.pt is identical regardless of modality_types,
# confirmed identical md5sum, only the embeddings-generation step's
# declared modality differs).
model_params:
  embed_dim: 128
  num_heads: 4
  num_layers: 2
  num_classes: 5
  pooling_head: 4
  dropout: 0.3
  max_seq_length: 1500
max_channels: 4
context: -1
seed: 42
model: "SleepEventLSTMClassifier"
dataset: "i0006"
batch_size: 16
epochs: 500
lr: 0.0001
num_workers: 2
early_stopping_patience: 50
data_path: "/scratch/project_2019517/moody2026_pilot/hdf5_included"
model_path: "/scratch/project_2019517/moody2026_pilot/retrain/encoders/nexttoken_moody_EEG3_ONLY/SetTransformer/nexttoken_128_patch_size_640"
split_path: "/scratch/project_2019517/moody2026_pilot/splits/dataset_split_moody_i0006_fold5_v1.json"
labels_path: "/scratch/project_2019517/moody2026_pilot/labels_included"
save_iter: 1000
eval_iter: 1000
log_interval: 10
accumulation_steps: 16
use_wandb: false
max_files: null
sampling_freq: 128
channel_like: ["EEG3_ONLY"]
