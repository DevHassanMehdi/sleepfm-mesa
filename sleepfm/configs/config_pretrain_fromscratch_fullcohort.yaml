# Full-cohort (1944-subject) From-Scratch SleepFM encoder pretraining.
# Same architecture/hyperparameters as config_pretrain_fromscratch.yaml --
# only data_path/split_path/save_path point at the full cohort instead of
# the 350-subject Puhti-era baseline. Full multimodal channel set
# (BAS+RESP+EKG+EMG), matching the original fromscratch config -- NOT the
# narrower fromscratch_eegonly variant.
seed: 42
model: 'SetTransformer'
in_channels: 1
batch_size: 128
epochs: 100
lr: 0.001
lr_step_period: 2
gamma: 0.1
temperature: 0.0
momentum: 0.9
num_workers: 8
embed_dim: 128
num_heads: 8
num_layers: 6
pooling_head: 8
dropout: 0.3

data_path: '/scratch/project_2019517/sleepfm-data/mesa/hdf5_full'
split_path: 'sleepfm/configs/dataset_split_fromscratch_fullcohort.json'
save_path: '/scratch/project_2019517/sleepfm-data/checkpoints/encoders/fromscratch_fullcohort'
weight_decay: 0.0

# contrastive learning objective you want. pairwise vs. leave_one_out
mode: "leave_one_out"
save_iter: 5000
eval_iter: 5000
log_interval: 100
use_wandb: false

# dataloader configs (unused by pretrain.py -- carried forward unchanged
# from config_pretrain_fromscratch.yaml for consistency)
BAS_CHANNELS: 10
RESP_CHANNELS: 7
EKG_CHANNELS: 2
EMG_CHANNELS: 4

max_files: null
val_size: 100
sampling_duration: 5
sampling_freq: 128
patch_size: 640

# modalities you want to train on. Select at least one
modality_types: ["BAS", "RESP", "EKG", "EMG"]
