# Modality-set ablation, Arm A -- full 2056-subject cohort, otherwise
# IDENTICAL to config_pretrain_fromscratch_eegonly_fullcohort.yaml
# (same split file, same weight_decay=0.0001/lr_step_period=null fix,
# 100 epochs). Only modality_types changes: EEG_ONLY + RESP + EKG + EMG,
# the full original 4-modality leave-one-out scope. Tests whether
# From-Scratch's elevated ECG_ONLY fine-tuning result (see
# results/ALL_RESULTS_FULL.md Discussion) depends specifically on
# narrowing pretraining to just EEG+ECG, by pretraining on the full
# original channel scope instead and comparing downstream ECG_ONLY
# fine-tuning performance.
seed: 42
model: 'SetTransformer'
in_channels: 1
batch_size: 128
epochs: 100
lr: 0.001
lr_step_period: null
gamma: 0.1
temperature: 0.0
momentum: 0.9
num_workers: 8
embed_dim: 128
num_heads: 8
num_layers: 6
pooling_head: 8
dropout: 0.3

data_path: '/scratch/project_2019517/sleepfm-data/mesa/hdf5_full'
split_path: 'sleepfm/configs/dataset_split_fromscratch_fullcohort.json'
save_path: '/scratch/project_2019517/sleepfm-data/checkpoints/encoders/fromscratch_ablation_A_fullcohort'
weight_decay: 0.0001

# contrastive learning objective you want. pairwise vs. leave_one_out
mode: "leave_one_out"
save_iter: 5000
eval_iter: 5000
log_interval: 100
use_wandb: false

# dataloader configs -- confirmed vestigial/unused for actual tensor
# shaping in pretrain.py's SetTransformerDataset (real per-modality
# channel count is dynamic per-subject, zero-padded+masked at collate
# time); kept here only for documentation. Values below are the real
# MESA channel counts, verified directly against hdf5_full/ across all
# 2056 subjects (RESP and EMG both consistently match on every
# subject -- see task report for the verification).
EEG_ONLY_CHANNELS: 3
RESP_CHANNELS: 6
EKG_CHANNELS: 2
EMG_CHANNELS: 3

max_files: null
val_size: 100
sampling_duration: 5
sampling_freq: 128
patch_size: 640

# modalities you want to train on. Select at least one
modality_types: ["EEG_ONLY", "RESP", "EKG", "EMG"]
