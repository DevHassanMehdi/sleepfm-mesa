# Experiment A (pretraining-vs-data isolation diagnostic): full-cohort
# fine-tuning (fold5_v1) using embeddings generated from the ORIGINAL
# 350-subject fromscratch_eegonly encoder's best.pt (weights unchanged
# since 2026-06-24), applied to the FULL 1944-subject cohort's raw signal.
# Identical hyperparameters to config_finetune_full_cohort.yaml -- only
# model_path differs (old encoder instead of the full-cohort-pretrained
# one). Compares against the full-cohort From-Scratch encoder's 5-fold
# mean (0.5162) to isolate whether the F1 gap traces to pretraining
# (old vs full-cohort encoder) or elsewhere in the pipeline.
model_params:
  embed_dim: 128
  num_heads: 4
  num_layers: 2
  num_classes: 5
  pooling_head: 4
  dropout: 0.3
  max_seq_length: 1500

max_channels: 4
context: -1
seed: 42
model: "SleepEventLSTMClassifier"
dataset: "mesa"
batch_size: 16
epochs: 500
lr: 0.0001
num_workers: 2
early_stopping_patience: 50

data_path: "/scratch/project_2019517/sleepfm-data/mesa/hdf5_full"
model_path: "/scratch/project_2019517/sleepfm-data/checkpoints/encoders/fromscratch_eegonly/SetTransformer/leave_one_out_128_patch_size_640"
split_path: "sleepfm/configs/dataset_split_fold5_v1.json"
labels_path: "/scratch/project_2019517/sleepfm-data/mesa/labels"
save_iter: 1000
eval_iter: 1000
log_interval: 10
accumulation_steps: 16
use_wandb: false

max_files: null
sampling_freq: 128

channel_like: ["EEG_ONLY"]
