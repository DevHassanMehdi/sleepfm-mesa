# Full-cohort (1944-subject) Spectral encoder pretraining -- EEG_ONLY-atomic
# variant. Same architecture/hyperparameters as config_pretrain_spectral.yaml
# -- data_path/split_path point at the full cohort instead of the 350-subject
# Puhti-era baseline, and the underlying cache (built by build_spectral_cache.py,
# now edited to scan EEG_ONLY_CHANNELS = ["EEG1","EEG2","EEG3"] instead of the
# old BAS_CHANNELS 5-channel list) lives in its own dedicated directory so it
# can never collide with or overwrite the existing 350-subject cache.
seed: 42
model: 'SetTransformer'
in_channels: 1
embed_dim: 128
num_heads: 8
num_layers: 6
pooling_head: 8
dropout: 0.3

# training
batch_size: 128
max_epochs: 100
num_workers: 8

# spectral-specific optimizer (Adam, not SGD)
spectral_lr: 0.001
spectral_weight_decay: 0.0001
patience: 10

# data
data_path: '/scratch/project_2019517/sleepfm-data/mesa/hdf5_full'
split_path: 'sleepfm/configs/dataset_split_fromscratch_fullcohort.json'
save_path: '/scratch/project_2019517/sleepfm-data/checkpoints/encoders/spectral_eegonly_fullcohort'
spectral_cache_dir: '/scratch/project_2019517/sleepfm-data/spectral_cache_eegonly_fullcohort'

# channel configuration. max_channels IS read directly by
# pretrain_spectral.py (SpectralDataset.__init__: config.get("max_channels",
# 10), used for the memmap's shape) -- must match build_spectral_cache.py's
# MAX_CHANNELS exactly (4: EEG_ONLY(3) + EKG(1), MESA's actual real channel
# count -- not the generic EKG_CHANNELS=2 config allowance) or the cache
# will be read with the wrong shape.
max_channels: 4
EEG_ONLY_CHANNELS: 3

# Keys required by generate_embeddings.py and finetune_sleep_staging.py
# (present for downstream compatibility; unused by spectral pretraining
# itself, which hardcodes EEG_ONLY_CHANNELS in build_spectral_cache.py).
# This encoder was pretrained on EEG+EKG signal (see build_spectral_cache.py's
# MODALITY_TYPES). modality_types here drives generate_embeddings.py's
# SetTransformerDataset directly -- it decides which channels get loaded
# from each subject's raw HDF5 AND which embedding keys get written out.
# Must list every modality the encoder actually saw during pretraining, or
# that modality's embeddings silently never get produced downstream.
modality_types:
  - 'EEG_ONLY'
  - 'EKG'
BAS_CHANNELS: 10
RESP_CHANNELS: 7
EKG_CHANNELS: 2
EMG_CHANNELS: 4

# sampling_duration (minutes) -- chunk size generate_embeddings.py's shared
# SetTransformerDataset uses to window raw signal for embedding extraction.
# Independent of how this encoder was pretrained (single 640-sample spectral
# windows); this only governs the downstream embedding-generation pass.
sampling_duration: 5
max_files: null

# spectral reconstruction targets: log10(power + 1e-8) per band
spectral_bands:
  - [0.5, 4.0]
  - [4.0, 8.0]
  - [8.0, 12.0]
  - [12.0, 15.0]
  - [15.0, 30.0]

# dataloader
val_size: 100
sampling_freq: 128
patch_size: 640
