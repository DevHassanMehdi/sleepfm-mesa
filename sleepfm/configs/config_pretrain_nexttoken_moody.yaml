# Moody/PhysioNet 2026 (I0006) Next-Token SleepFM encoder pretraining --
# EEG_ONLY + EKG only. Copied from config_pretrain_nexttoken_eegonly_fullcohort.yaml
# (the real MESA full-cohort config) with ONLY the cache/data/split/save
# paths changed to point at Moody instead -- every other hyperparameter
# (modality_types, epochs=100, patience=10, lr, weight_decay, batch_size,
# n_clusters=512, max_channels=4) is identical to the MESA config, so this
# is the same pretraining recipe applied to a different cohort, not a new
# recipe (the token *cache* itself required one documented deviation,
# --reseed_empty -- see RETRAIN_PHASE1_RESULTS.md -- but this pretraining
# config does not). BDSP-licensed data: save_path is owner-only, under
# /scratch/project_2019517/moody2026_pilot/, never under the shared
# checkpoints/encoders/ tree.
seed: 42
model: 'SetTransformer'
in_channels: 1
embed_dim: 128
num_heads: 8
num_layers: 6
pooling_head: 8
dropout: 0.3

batch_size: 128
epochs: 100
num_workers: 8

lr: 0.001
weight_decay: 0.0001
patience: 10

lr_step_period: null
gamma: null
temperature: null
momentum: null
mode: 'next_token'
save_iter: 5000
eval_iter: 5000
log_interval: 100
use_wandb: false

n_clusters: 512
token_codebook_path: '/scratch/project_2019517/moody2026_pilot/retrain/nexttoken_cache/token_codebook.npy'
token_pairs_pretrain_path: '/scratch/project_2019517/moody2026_pilot/retrain/nexttoken_cache/token_pairs_pretrain.npy'
token_pairs_validation_path: '/scratch/project_2019517/moody2026_pilot/retrain/nexttoken_cache/token_pairs_validation.npy'

spectral_cache_dir: '/scratch/project_2019517/moody2026_pilot/retrain/nexttoken_cache'
spectral_signals_path_pretrain: '/scratch/project_2019517/moody2026_pilot/retrain/nexttoken_cache/spectral_signals_pretrain.bin'
spectral_signals_path_validation: '/scratch/project_2019517/moody2026_pilot/retrain/nexttoken_cache/spectral_signals_validation.bin'
max_channels: 4

save_path: '/scratch/project_2019517/moody2026_pilot/retrain/encoders/nexttoken_moody'

data_path: '/scratch/project_2019517/moody2026_pilot/hdf5_included'
split_path: '/scratch/project_2019517/moody2026_pilot/splits/dataset_split_moody_i0006_pretrain.json'
BAS_CHANNELS: 10
RESP_CHANNELS: 7
EKG_CHANNELS: 2
EMG_CHANNELS: 4
EEG_ONLY_CHANNELS: 3
modality_types:
  - 'EEG_ONLY'
  - 'EKG'
max_files: null
val_size: 100

sampling_duration: 5
sampling_freq: 128
patch_size: 640
