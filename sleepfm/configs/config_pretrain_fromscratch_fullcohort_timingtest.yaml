# TIMING-TEST ONLY variant of config_pretrain_fromscratch_fullcohort.yaml --
# epochs capped low (2) purely to measure real per-epoch/per-iteration
# wall-clock cost on the full 1944-subject cohort before committing to the
# real 100-epoch run. Writes to a SEPARATE save_path so it can never be
# confused with (or overwrite) the real production checkpoint.
seed: 42
model: 'SetTransformer'
in_channels: 1
batch_size: 128
epochs: 2
lr: 0.001
lr_step_period: 2
gamma: 0.1
temperature: 0.0
momentum: 0.9
num_workers: 8
embed_dim: 128
num_heads: 8
num_layers: 6
pooling_head: 8
dropout: 0.3

data_path: '/scratch/project_2019517/sleepfm-data/mesa/hdf5_full'
split_path: 'sleepfm/configs/dataset_split_fromscratch_fullcohort.json'
save_path: '/scratch/project_2019517/sleepfm-data/checkpoints/encoders/fromscratch_fullcohort_timingtest'
weight_decay: 0.0

mode: "leave_one_out"
save_iter: 5000
eval_iter: 5000
log_interval: 20
use_wandb: false

BAS_CHANNELS: 10
RESP_CHANNELS: 7
EKG_CHANNELS: 2
EMG_CHANNELS: 4

max_files: null
val_size: 100
sampling_duration: 5
sampling_freq: 128
patch_size: 640

modality_types: ["BAS", "RESP", "EKG", "EMG"]
