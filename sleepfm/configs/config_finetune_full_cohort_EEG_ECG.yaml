# Full-cohort fine-tuning config (results/full_cohort + checkpoints/full_cohort
# pipeline). Same model_params as config_finetune_sleep_events.yaml (matches the
# historical fromscratch/EEG_ECG run's architecture) -- only the data paths
# differ, pointed at the full 1944-subject cohort instead of the 350-subject
# Puhti-era baseline.
model_params:
  embed_dim: 128
  num_heads: 4
  num_layers: 2
  num_classes: 5
  pooling_head: 4
  dropout: 0.3
  max_seq_length: 1500

max_channels: 4
context: -1
seed: 42
model: "SleepEventLSTMClassifier"
dataset: "mesa"
batch_size: 16
epochs: 500
lr: 0.0001
num_workers: 2
early_stopping_patience: 50

# data_path is only used to build the valid-subject-ID filter (existence +
# label-match check); the actual training data comes from model_path's
# embeddings cache (see sleepfm/models/dataset.py SleepEventClassificationDataset).
data_path: "/scratch/project_2019517/sleepfm-data/mesa/hdf5_full"
model_path: "/scratch/project_2019517/sleepfm-data/checkpoints/encoders/fromscratch_eegonly_fullcohort/SetTransformer/leave_one_out_128_patch_size_640"
split_path: "sleepfm/configs/dataset_split_fold5_v1.json"
labels_path: "/scratch/project_2019517/sleepfm-data/mesa/labels"
save_iter: 1000
eval_iter: 1000
log_interval: 10
accumulation_steps: 16
use_wandb: false

# dataloader configs
max_files: null
sampling_freq: 128

channel_like: ["EEG_ONLY", "EKG"]
