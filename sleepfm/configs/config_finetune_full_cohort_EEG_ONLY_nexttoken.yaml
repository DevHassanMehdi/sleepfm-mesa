# Full-cohort fine-tuning config for the Next-Token-pretrained encoder
# (checkpoints/encoders/nexttoken_eegonly_fullcohort). Same model_params/
# hyperparameters as config_finetune_full_cohort.yaml (the From-Scratch
# EEG_ONLY analogue) -- only model_path differs, pointing at the
# Next-Token encoder's best.pt-derived embeddings (epoch 55, genuine
# validation-loss optimum; final epoch was 66).
model_params:
  embed_dim: 128
  num_heads: 4
  num_layers: 2
  num_classes: 5
  pooling_head: 4
  dropout: 0.3
  max_seq_length: 1500

max_channels: 4
context: -1
seed: 42
model: "SleepEventLSTMClassifier"
dataset: "mesa"
batch_size: 16
epochs: 500
lr: 0.0001
num_workers: 2
early_stopping_patience: 50

data_path: "/scratch/project_2019517/sleepfm-data/mesa/hdf5_full"
model_path: "/scratch/project_2019517/sleepfm-data/checkpoints/encoders/nexttoken_eegonly_fullcohort/SetTransformer/nexttoken_128_patch_size_640"
split_path: "sleepfm/configs/dataset_split_fold5_v1.json"
labels_path: "/scratch/project_2019517/sleepfm-data/mesa/labels"
save_iter: 1000
eval_iter: 1000
log_interval: 10
accumulation_steps: 16
use_wandb: false

max_files: null
sampling_freq: 128

channel_like: ["EEG_ONLY"]
