# SMOKE TEST ONLY -- modality-set ablation Arm A (EEG_ONLY+RESP+EKG+EMG),
# tiny subject subset (25 pretrain + 10 validation,
# dataset_split_spectral_cache_timingtest.json), 3 epochs. Uses the FIXED
# hyperparameters (weight_decay=0.0001, lr_step_period=null), NOT the old
# buggy smoketest template's values (weight_decay=0.0, lr_step_period=2)
# -- that combination is exactly what caused the earlier flat-validation-
# curve bug, and reusing it here would confound "is the modality set
# causing a problem" with "is the old LR bug back". Writes to a SEPARATE
# save_path so it can never be confused with or overwrite the real
# full-cohort checkpoint.
seed: 42
model: 'SetTransformer'
in_channels: 1
batch_size: 8
epochs: 3
lr: 0.001
lr_step_period: null
gamma: 0.1
temperature: 0.0
momentum: 0.9
num_workers: 4
embed_dim: 128
num_heads: 8
num_layers: 6
pooling_head: 8
dropout: 0.3

data_path: '/scratch/project_2019517/sleepfm-data/mesa/hdf5_full'
split_path: 'sleepfm/configs/dataset_split_spectral_cache_timingtest.json'
save_path: '/scratch/project_2019517/sleepfm-data/checkpoints/encoders/runtracking_test_normal'
weight_decay: 0.0001

mode: "leave_one_out"
save_iter: 50
eval_iter: 50
log_interval: 5
use_wandb: false

EEG_ONLY_CHANNELS: 3
RESP_CHANNELS: 6
EKG_CHANNELS: 2
EMG_CHANNELS: 3

max_files: null
val_size: 10
sampling_duration: 5
sampling_freq: 128
patch_size: 640

modality_types: ["EEG_ONLY", "RESP", "EKG", "EMG"]
