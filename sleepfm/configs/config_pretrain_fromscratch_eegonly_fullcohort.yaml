# Full-cohort (1944-subject) From-Scratch SleepFM encoder pretraining --
# EEG_ONLY + EKG only. Narrowed from the earlier 4-modality
# (EEG_ONLY/RESP/EKG/EMG) scope specifically to match Spectral and
# Next-Token's scope (both are architecturally EEG+EKG-only -- see
# PIPELINE_VALIDATION_FINDINGS.md Section 7), so all three pretraining
# methods are compared on the same channel scope. This is a genuinely
# separate pretraining run from random init. Serves EEG_ONLY, ECG_ONLY,
# and EEG_ECG downstream fine-tuning from this same run's leave-one-out
# output (RESP/EMG are no longer part of the contrastive objective).
seed: 42
model: 'SetTransformer'
in_channels: 1
batch_size: 128
epochs: 100
lr: 0.001
lr_step_period: 2
gamma: 0.1
temperature: 0.0
momentum: 0.9
num_workers: 8
embed_dim: 128
num_heads: 8
num_layers: 6
pooling_head: 8
dropout: 0.3

data_path: '/scratch/project_2019517/sleepfm-data/mesa/hdf5_full'
split_path: 'sleepfm/configs/dataset_split_fromscratch_fullcohort.json'
save_path: '/scratch/project_2019517/sleepfm-data/checkpoints/encoders/fromscratch_eegonly_fullcohort'
weight_decay: 0.0

# contrastive learning objective you want. pairwise vs. leave_one_out
mode: "leave_one_out"
save_iter: 5000
eval_iter: 5000
log_interval: 100
use_wandb: false

# dataloader configs (unused by pretrain.py -- carried forward unchanged
# from config_pretrain_eegonly.yaml for consistency)
EEG_ONLY_CHANNELS: 3
RESP_CHANNELS: 7
EKG_CHANNELS: 2
EMG_CHANNELS: 4

max_files: null
val_size: 100
sampling_duration: 5
sampling_freq: 128
patch_size: 640

# modalities you want to train on. Select at least one
modality_types: ["EEG_ONLY", "EKG"]
