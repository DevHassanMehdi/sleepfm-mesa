# Combined contrastive + spectral pretraining config.
# Total loss = contrastive_loss + lambda_spectral * spectral_loss
model: 'SetTransformer'
in_channels: 1
batch_size: 128
epochs: 100
lr: 0.001
lr_step_period: 2
gamma: 0.1
temperature: 0.0
momentum: 0.9
num_workers: 8
weight_decay: 0.0
embed_dim: 128
num_heads: 8
num_layers: 6
pooling_head: 8
dropout: 0.3

data_path: 'data/mesa/hdf5'
split_path: 'sleepfm/configs/dataset_split_fromscratch.json'
save_path: '/scratch/project_2019517/sleepfm-data/checkpoints/combined'

# contrastive objective
mode: "leave_one_out"

# spectral aux loss
lambda_spectral: 0.5
spectral_modality: "BAS"
spectral_bands:
  - [0.5, 4.0]
  - [4.0, 8.0]
  - [8.0, 12.0]
  - [12.0, 15.0]
  - [15.0, 30.0]

# checkpointing
save_iter: 5000
eval_iter: 5000
log_interval: 100
use_wandb: false

# dataloader configs
BAS_CHANNELS: 10
RESP_CHANNELS: 7
EKG_CHANNELS: 2
EMG_CHANNELS: 4

max_files: null
val_size: 100
sampling_duration: 5
sampling_freq: 128
patch_size: 640

modality_types: ["BAS", "RESP", "EKG", "EMG"]
